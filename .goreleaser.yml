version: 2

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: kubectl-ice
    binary: kubectl-ice
    main: ./cmd/plugin/main.go
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/PixiBixi/kubectl-ice/cmd/plugin/cli.version={{ .Version }}

archives:
  - id: default
    ids: [kubectl-ice]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE*
      - NOTICE

krews:
  - name: ice
    ids: [default]
    repository:
      owner: PixiBixi
      name: krew-index
      branch: main
      token: "{{ .Env.KREW_INDEX_TOKEN }}"
    homepage: "https://github.com/PixiBixi/kubectl-ice"
    short_description: "View configuration settings of containers inside Pods"
    description: |
      ice lets you peer inside a Pod and easily see Volume, Image, Port and Exec
      configurations, along with CPU and Memory metrics all at the container
      level (requires metrics server). PixiBixi maintained fork with watch mode,
      node/conditions/completion commands and performance improvements.
    caveats: "Run 'kubectl ice completion install' to enable shell completion."
    skip_upload: auto

# syft runs over each archive, so the release carries what is inside the
# artifact, not just how it was built. The provenance attestation in
# release.yml covers these files too, so a swapped SBOM does not verify.
sboms:
  - artifacts: archive

# Keyless, so there is no private key to store or rotate: the identity comes from
# the GitHub OIDC token and lands in the Sigstore transparency log.
#
# Signing checksums.txt covers every archive at once, since it holds their
# SHA256. cosign v3 writes one .sigstore.json bundle instead of the old .sig plus
# .pem pair, so verification is `cosign verify-blob --bundle <file>.sigstore.json`.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude: ['^docs:', '^test:', '^chore:', 'typo']
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Bug Fixes
      regexp: '^fix'
      order: 1
    - title: Others
      order: 999

release:
  github:
    owner: PixiBixi
    name: kubectl-ice
  name_template: "{{ .ProjectName }} {{ .Version }}"
  draft: false
  prerelease: auto
  mode: replace
