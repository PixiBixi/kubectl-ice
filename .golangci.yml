version: "2"

run:
  timeout: 5m

linters:
  default: standard # govet, staticcheck, errcheck, ineffassign, unused
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - durationcheck
    - errorlint
    - forcetypeassert
    - gosec
    - gocritic
    - misspell
    - modernize
    - nilerr
    - noctx
    - perfsprint
    - revive
    - unconvert
    - usestdlibvars
  settings:
    gocritic:
      enabled-tags:
        - performance
      settings:
        # The Looper interface passes BuilderInformation (1408 bytes as of
        # k8s.io/api v0.37) and v1.Pod (1240) by value per container,
        # deliberately. Passing them by pointer was measured at +6% time and
        # +152% allocations: taking the address for an interface method call
        # moves them to the heap, while the by-value copy is a stack memcpy.
        # Thresholds sit just above those two so the checks still catch anything
        # larger, so a k8s.io/api bump that adds Pod fields needs them raised.
        hugeParam:
          sizeThreshold: 1450
        rangeValCopy:
          sizeThreshold: 1250
    errcheck:
      # Output writers: a failed write to stdout or a closed pipe is not
      # actionable in a table renderer.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        - G104 # unhandled errors: fully overlaps errcheck, which is tuned above
    revive:
      rules:
        # pkg/plugin is importable but is not a published api, the plugin is
        # consumed as a binary.
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true
        - name: redefines-builtin-id # min/max/cap as local names is readable here
          disabled: true
        - name: unused-parameter # every Looper method shares a fixed signature
          disabled: true
  exclusions:
    rules:
      # gosec on tests is noisy (file perms, variable file inclusion) and not a
      # runtime concern.
      - path: _test\.go
        linters:
          - gosec

issues:
  # Show every finding. The defaults (max-issues-per-linter 50, max-same-issues 3)
  # hide repeats, which makes a partial fix look complete.
  max-issues-per-linter: 0
  max-same-issues: 0
